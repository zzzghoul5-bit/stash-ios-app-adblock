name: Validate Stash ad-block rules

on:
  push:
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependency
        run: python -m pip install PyYAML

      - name: Check generated overrides
        run: npm run build:check

      - name: Run tests and static validation
        run: npm run test && npm run validate

      - name: Check upstream lock structure
        if: github.event_name == 'pull_request'
        run: npm run check:updates:offline

      - name: Check monitored upstreams
        if: github.event_name != 'pull_request'
        run: npm run check:updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
